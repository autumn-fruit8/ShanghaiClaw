name: volume
description: >
  Volume-confirmed momentum. Buy only when price is above MA200, 20d RoC is
  positive, AND trading volume exceeds 1.2x the 20-day average. Sell when
  RoC drops below -3% (tolerant) or both MAs break. Designed for high-volume,
  momentum-responsive assets like ChiNext (159952).

rules:
  # Priority 1: Both MAs broken → clear position
  - id: major_trend_break
    label: Major Trend Break
    when:
      - price_above_ma_60: { eq: false }
      - price_above_ma_200: { eq: false }
    do: { verb: SELL, fraction: 1.0 }
    signal: TREND_BREAK

  # Priority 2: Momentum collapse → exit
  - id: momentum_collapse
    label: Momentum Collapse
    when:
      - roc: { lt: -12.0 }
    do: { verb: SELL, fraction: 1.0 }
    signal: MOMENTUM_COLLAPSE
    cooldown: 20

  # Priority 3: Volume-confirmed trend entry
  - id: trend_entry_volume
    label: Volume-Confirmed Trend Entry
    when:
      - roc: { gt: 0.0 }
      - price_above_ma_200: { eq: true }
      - vol_ratio: { gte: 1.2 }
    do: { verb: BUY, fraction: 1.0 }
    signal: VOL_CONFIRMED_ENTRY
    cooldown: 10

  # Priority 4: Tolerant exit on minor pullback
  - id: tolerant_exit
    label: Tolerant Exit
    when:
      - roc: { lt: -3.0 }
    do: { verb: SELL, fraction: 1.0 }
    signal: TOLERANT_EXIT
    cooldown: 5
