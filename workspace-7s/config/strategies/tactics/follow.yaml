name: follow
description: Trend following — enter on trend confirmation, exit on trend break. Suitable for MOMENTUM assets.
rules:
  # Priority 1: Both MAs broken → clear position (major trend reversal)
  - id: major_trend_break
    label: Major Trend Break
    when:
      - price_above_ma_60: { eq: false }
      - price_above_ma_200: { eq: false }
    do: { verb: SELL, fraction: 1.0 }
    signal: TREND_BREAK

  # Priority 2: 20-day drop > 12% → exit (momentum collapse)
  - id: momentum_collapse
    label: Momentum Collapse
    when:
      - roc: { lt: -12.0 }
    do: { verb: SELL, fraction: 1.0 }
    signal: MOMENTUM_COLLAPSE
    cooldown: 20

  # Priority 3: Positive momentum above MA200 → enter
  - id: trend_entry
    label: Trend Entry
    when:
      - roc: { gt: 0.0 }
      - price_above_ma_200: { eq: true }
    do: { verb: BUY, fraction: 1.0 }
    signal: TREND_ENTRY
    cooldown: 10
